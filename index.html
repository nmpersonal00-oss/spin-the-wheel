#aurora{position:fixed;inset:-20%;z-index:-3;pointer-events:none;background:radial-gradient(ellipse at 32% 42%,rgba(255,74,164,.14),transparent 36%),radial-gradient(ellipse at 68% 41%,rgba(177,82,251,.15),transparent 38%);filter:blur(36px);animation:aurora 18s ease-in-out infinite alternate}@keyframes aurora{from{transform:translateX(-4%) scale(1);opacity:.7}to{transform:translateX(5%) scale(1.08);opacity:1}}
#ambient{position:fixed;inset:0;z-index:-2;pointer-events:none;width:100%;height:100%}#veil{position:fixed;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(20,4,30,.13),transparent 30% 70%,rgba(20,4,30,.08));pointer-events:none}
.app{width:min(100%,1640px);margin:0 auto;min-height:100svh;display:flex;flex-direction:column;padding:14px clamp(18px,3.2vw,52px) 22px;position:relative}
.topbar{display:flex;align-items:center;justify-content:center;min-height:111px;position:relative}.branding{text-align:center;pointer-events:none}.eyebrow{margin:0 0 -8px;letter-spacing:.36em;text-transform:uppercase;font-size:10px;color:#ffbddc;font-weight:700}.title{font-family:'Great Vibes','Z003','Brush Script MT',cursive;font-weight:400;font-size:clamp(64px,6.2vw,100px);line-height:1.13;margin:0;color:#fff1fa;text-shadow:0 0 4px #fff1fb,0 0 13px rgba(255,101,196,.92),0 0 37px rgba(255,41,156,.45)}.brand-rule{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:-14px;opacity:.85}.brand-rule:before,.brand-rule:after{content:'';height:1px;width:100px;background:linear-gradient(90deg,transparent,#ff95ce)}.brand-rule:after{transform:rotate(180deg)}.brand-rule svg{width:37px;height:21px;fill:#ffc0e4;filter:drop-shadow(0 0 8px #f64ba4)}
.tools{position:absolute;right:0;top:22px;display:flex;align-items:center;gap:12px;z-index:12}.tiny-label{font-size:12px;color:#ffcced}.sound-control{display:flex;align-items:center;gap:8px;background:rgba(45,13,56,.68);border:1px solid var(--stroke);padding:7px 10px;border-radius:100px;backdrop-filter:blur(12px)}.sound-control input{width:78px;height:5px;accent-color:#ff94d3;cursor:pointer}.icon-btn{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;color:#ffe1f4;background:rgba(244,89,181,.16);border:1px solid rgba(255,192,226,.37)}.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.workspace{flex:1;display:grid;grid-template-columns:minmax(256px,310px) minmax(440px,1fr) minmax(206px,270px);gap:clamp(14px,2.6vw,40px);align-items:center;padding:6px 0 46px}
.panel{background:linear-gradient(155deg,rgba(75,26,79,.84),rgba(31,9,46,.86));border:1px solid rgba(255,165,217,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 0 0 1px rgba(255,213,236,.08) inset,0 18px 50px rgba(20,2,32,.34),0 0 27px rgba(255,90,182,.19);border-radius:28px;position:relative}
.entry-panel{padding:24px 21px 19px;max-height:min(73svh,650px);display:flex;flex-direction:column;min-height:350px}.panel-flower{position:absolute;top:-22px;left:calc(50% - 19px);width:38px;height:38px;filter:drop-shadow(0 0 12px #ed76bf);pointer-events:none}.panel-title{font-family:Georgia,serif;font-weight:normal;font-style:italic;font-size:clamp(24px,2.2vw,32px);text-align:center;margin:6px 0 6px;color:#ffddf0;text-shadow:0 0 12px rgba(255,102,186,.45)}.subhead{text-align:center;margin:0 0 17px;color:#ebbadc;font-size:12px;line-height:1.5}.item-form{display:flex;gap:8px}.item-form input{width:100%;min-width:0;padding:0 15px;border-radius:16px;height:46px;border:1px solid rgba(255,172,224,.52);background:rgba(33,10,43,.55);color:#fff4fc;font-size:14px;outline:none}.item-form input::placeholder{color:#e8a6d1}.add-btn{flex:0 0 46px;width:46px;height:46px;border:1px solid #ffb5e5;border-radius:15px;background:linear-gradient(145deg,#fb90d2,#bc468f);color:#fff;font-size:29px;font-weight:400;line-height:1;box-shadow:inset 0 1px 7px #ffe3f2a0,0 0 13px #ed56b34f}.item-list{margin:15px 0 15px;overflow:auto;display:grid;gap:8px;align-content:start;min-height:132px;max-height:min(42svh,350px);padding:1px 5px 3px 0;scrollbar-color:#a64e99 transparent;scrollbar-width:thin}.entry-row{display:flex;gap:10px;align-items:center;min-height:39px;border:1px solid rgba(255,198,235,.13);background:rgba(255,169,224,.075);border-radius:12px;padding:6px 6px 6px 12px}.entry-mark{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--dot);box-shadow:0 0 9px var(--dot)}.entry-name{font-size:13px;color:#ffe7f7;flex:1;overflow-wrap:anywhere;line-height:1.3}.remove{width:29px;height:29px;background:none;border:none;color:#efb2db;border-radius:10px;display:grid;place-items:center}.remove:hover{background:#d54f9c42}.remove svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none}.empty{font-size:13px;text-align:center;padding:28px 12px;color:#e5bad6;line-height:1.7}.row-actions{display:flex;gap:9px;margin-top:auto}.subtle-btn{flex:1;padding:11px 7px;font-size:12px;font-weight:700;letter-spacing:.01em;border-radius:13px;border:1px solid rgba(255,185,228,.49);background:rgba(246,115,188,.13);color:#ffdcef}.subtle-btn:hover{background:rgba(251,118,191,.29)}.panel-count{display:flex;align-items:center;gap:7px;color:#dbaccd;font-size:11px;margin:14px 0 0}.panel-count:before{content:'';height:5px;width:5px;border-radius:50%;background:#efa8d4;box-shadow:0 0 9px #fa83c4}
.wheel-section{display:flex;align-items:center;justify-content:center;min-width:0;position:relative}.wheel-wrap{width:min(100%,min(71svh,740px));aspect-ratio:1;position:relative;flex-shrink:0;filter:drop-shadow(0 12px 34px rgba(8,2,22,.42))}.wheel-wrap::before{content:'';inset:-4%;position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,111,200,.17) 55%,rgba(255,112,197,.20) 64%,transparent 72%);filter:blur(18px);animation:ringPulse 4s ease-in-out infinite alternate;pointer-events:none}@keyframes ringPulse{to{opacity:.5;transform:scale(1.04)}}.wheel-frame{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 30%,rgba(255,215,249,.33),transparent 44%);border:3px solid rgba(255,208,238,.86);box-shadow:inset 0 0 13px #ffceeeaf,inset 0 0 33px #fa46ad6e,0 0 14px #ff6cc2,0 0 45px #f849b35d;z-index:1;pointer-events:none}.wheel-frame::after{content:'';position:absolute;inset:2.1%;border-radius:50%;border:2px solid #ffd8f68c;box-shadow:inset 0 0 14px rgba(250,108,180,.4)}.wheel-rotor{position:absolute;inset:5%;border-radius:50%;overflow:hidden;transform:rotate(0deg);will-change:transform;z-index:2;box-shadow:inset 0 0 30px rgba(47,6,56,.45)}#wheelCanvas{height:100%;width:100%;display:block}.lights{position:absolute;inset:0;z-index:4;pointer-events:none}.bulb{position:absolute;left:50%;top:50%;width:6px;height:6px;background:#ffe5f0;border-radius:50%;box-shadow:0 0 5px #fff,0 0 13px #ff8ccc;opacity:.87;transform:translate(-50%,-50%)}.pointer{position:absolute;top:-1.8%;left:50%;transform:translateX(-50%);width:clamp(52px,12%,86px);z-index:7;filter:drop-shadow(0 0 13px #f639a9);pointer-events:none}.pointer svg{display:block;width:100%}.hub{width:25%;position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);z-index:5;filter:drop-shadow(0 0 12px #f43f98);pointer-events:none}.hub svg{width:100%;display:block}

<script>
(()=>{'use strict';
const $=s=>document.getElementById(s), defaultItems=['Pink Bow','Strawberry Cake','Cherry Blossom','Butterfly','Moonlight','Crystal Heart','Wishing Star'];

const load=()=>{try{const data=JSON.parse(localStorage.getItem('sakura-spin-v3'));if(data&&Array.isArray(data.items))return {items:data.items.filter(s=>typeof s==='string'&&s.trim()).slice(0,80),muted:!!data.muted,volume:Math.max(0,Math.min(100,+data.volume||0))};}catch(e){}return null};
let saved=load(),items=saved?saved.items:[...defaultItems],muted=saved?saved.muted:false,volume=saved?saved.volume:22;

const audio=$('applause');

function renderList(){const list=$('itemList');list.replaceChildren();if(!items.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='Your wheel is empty. Add a few choices to start.';list.append(empty)}items.forEach((name,i)=>{const row=document.createElement('div');row.className='entry-row';const dot=document.createElement('i');dot.className='entry-mark';dot.style.setProperty('--dot',colors[i%colors.length]);const title=document.createElement('span');title.className='entry-name';title.textContent=name;const rm=document.createElement('button');rm.type='button';rm.className='remove';rm.innerHTML=tinyTrash;rm.title='Remove '+name;rm.setAttribute('aria-label','Remove '+name);rm.disabled=spinning;rm.addEventListener('click',()=>{if(spinning)return;items.splice(i,1);update()});row.append(dot,title,rm);list.append(row)});$('countText').textContent=items.length+' choice'+(items.length===1?'':'s')+' on your wheel';$('ready').textContent=items.length+' CHOICE'+(items.length===1?'':'S')+' READY';$('spin').disabled=spinning||!items.length;$('actionStatus').textContent=spinning?'Spinning…':items.length?'Tap spin to choose':'Add an item to begin';}

// Tiny offline bell and marimba-like sounds, unlocked by real user gestures.
let synthContext=null,synthBus=null,lastPreview=0;
function unlockSounds(){
  if(muted||volume<=0)return null;
  try{
    if(!synthContext){
      const AudioConstructor=window.AudioContext||window.webkitAudioContext;
      if(!AudioConstructor)return null;
      synthContext=new AudioConstructor();
      synthBus=synthContext.createGain();
      synthBus.connect(synthContext.destination);
    }
    const t=synthContext.currentTime;
    synthBus.gain.setTargetAtTime(Math.min(.5,volume/100*.72),t,.02);
    if(synthContext.state==='suspended')synthContext.resume().catch(()=>{});
    return synthContext;
  }catch(e){return null}
}
function muteSounds(){
  if(synthBus&&synthContext){
    try{synthBus.gain.setTargetAtTime(0,synthContext.currentTime,.012)}catch(e){}
  }

function bell(pitch,offset=.0,duration=.17,loudness=.23){
  const ac=unlockSounds();if(!ac)return;
  try{
    const t=ac.currentTime+offset;
    // Two short harmonics make a light, musical chime rather than an aggressive beep.
    for(const harmonic of [1,2.01]){
      const oscillator=ac.createOscillator(),gain=ac.createGain();

      gain.gain.exponentialRampToValueAtTime(amplitude,t+.006);
      gain.gain.exponentialRampToValueAtTime(.0001,t+duration);

      oscillator.start(t);oscillator.stop(t+duration+.012);
    }

function kawaiiSound(type='tap'){
  if(muted||volume<=0)return;
  switch(type){
    case 'spin':
      [[784,0],[988,.095],[1175,.19],[1568,.285]].forEach(([f,t])=>bell(f,t,.29,.24));break;
    case 'tick': bell(740,0,.052,.13);break;
    case 'win':
      [[880,0],[1109,.115],[1319,.23],[1760,.36]].forEach(([f,t])=>bell(f,t,.44,.21));break;
    case 'add': bell(784,0,.16,.25);bell(1175,.09,.26,.23);break;
    case 'remove': bell(880,0,.13,.18);bell(659,.09,.19,.17);break;
    case 'shuffle': [[880,0],[1175,.07],[988,.14]].forEach(([f,t])=>bell(f,t,.17,.19));break;

// The wheel and its icons are vector shapes painted fresh for the current choices. No screenshot layers.

function butterfly(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle='#fff1fd';ctx.lineWidth=3;ctx.fillStyle='#f5d4fe';for(const d of [-1,1]){ctx.save();ctx.scale(d,1);ctx.beginPath();ctx.moveTo(0,-7);ctx.bezierCurveTo(14,-38,47,-41,42,-12);ctx.bezierCurveTo(39,9,19,7,0,-7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,3);ctx.bezierCurveTo(32,1,32,31,13,30);ctx.bezierCurveTo(4,25,0,12,0,3);ctx.fillStyle='#dfa4f5';ctx.fill();ctx.stroke();ctx.restore()}ellipse(0,1,4,18,0,'#fff0eb');ctx.beginPath();ctx.moveTo(-2,-16);ctx.quadraticCurveTo(-8,-31,-14,-26);ctx.moveTo(2,-16);ctx.quadraticCurveTo(8,-31,14,-26);ctx.stroke();ctx.restore()}
function bow(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineWidth=3;ctx.strokeStyle='#fff1fd';ctx.fillStyle='#ffc5df';ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-24,-38,-54,-35,-52,0);ctx.bezierCurveTo(-51,28,-20,24,0,0);ctx.bezierCurveTo(20,-24,51,-28,52,0);ctx.bezierCurveTo(54,35,24,38,0,0);ctx.fill();ctx.stroke();ctx.fillStyle='#ee82be';ctx.beginPath();ctx.moveTo(-7,10);ctx.lineTo(-27,41);ctx.lineTo(-3,33);ctx.lineTo(5,12);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(7,10);ctx.lineTo(27,41);ctx.lineTo(3,33);ctx.lineTo(-5,12);ctx.closePath();ctx.fill();ellipse(0,0,12,11,0,'#ff69b5','#fff3f9');ctx.restore()}
function strawberry(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineWidth=3;ctx.strokeStyle='#ffd1e3';ctx.fillStyle='#f65b9f';ctx.beginPath();ctx.moveTo(0,-18);ctx.bezierCurveTo(45,-36,38,21,0,47);ctx.bezierCurveTo(-38,21,-45,-36,0,-18);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#abd38a';for(let i=0;i<5;i++){ctx.save();ctx.rotate(i*1.22);ctx.beginPath();ctx.moveTo(0,-17);ctx.quadraticCurveTo(16,-38,0,-34);ctx.quadraticCurveTo(-5,-24,0,-17);ctx.fill();ctx.restore()}for(let i=0;i<9;i++){ellipse((i%3-1)*16+(i%2?4:0),-2+Math.floor(i/3)*13,2,4,.2,'#ffe5ad')}ctx.restore()}
function moon(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#fff0c9';ctx.strokeStyle='#fff5de';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,40,Math.PI*.22,Math.PI*1.8,false);ctx.bezierCurveTo(-11,-40,-16,6,22,25);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function cake(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#ffb0d6';ctx.strokeStyle='#fff3f9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-37,-8);ctx.lineTo(35,-8);ctx.lineTo(27,32);ctx.lineTo(-28,32);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-40,-12);ctx.bezierCurveTo(-33,-39,29,-39,40,-12);ctx.lineTo(35,-2);ctx.bezierCurveTo(20,-18,14,3,5,-6);ctx.bezierCurveTo(-6,-20,-20,3,-27,-6);ctx.closePath();ctx.fillStyle='#fff5f3';ctx.fill();ctx.stroke();ellipse(0,-36,11,11,0,'#f65b9c','#fff1ef');ctx.restore()}
function sparkle(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#ffeacb';ctx.strokeStyle='#fff9ed';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-40);ctx.quadraticCurveTo(7,-9,39,0);ctx.quadraticCurveTo(7,8,0,40);ctx.quadraticCurveTo(-7,8,-39,0);ctx.quadraticCurveTo(-7,-9,0,-40);ctx.fill();ctx.stroke();ctx.restore()}
function iconFor(name,index,x,y,s){const str=name.toLowerCase();ctx.save();ctx.shadowColor='#421346';ctx.shadowBlur=9;ctx.lineWidth=3;ctx.strokeStyle='#fff0f8';ctx.fillStyle='#ffb5db';if(/bow|ribbon/.test(str))bow(x,y,s);else if(/flower|blossom|sakura|rose/.test(str))blossom(x,y,s*.85);else if(/cake|cupcake|sweet/.test(str))cake(x,y,s);else if(/strawberry|berry|cherr/.test(str))strawberry(x,y,s);else if(/butterfly|flutter/.test(str))butterfly(x,y,s);else if(/moon|night/.test(str))moon(x,y,s);else if(/heart|love/.test(str))heart(x,y,s*.8);else star(x,y,s*38);ctx.restore()}
function drawWheel(){const n=items.length;ctx.clearRect(0,0,900,900);if(!n){const g=ctx.createRadialGradient(450,400,10,450,450,450);g.addColorStop(0,'#d98fce');g.addColorStop(1,'#73356e');ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.fillStyle='#fff3fc';ctx.font='italic 34px Georgia';ctx.textAlign='center';ctx.fillText('Add your choices',450,454);return}const step=Math.PI*2/n;for(let i=0;i<n;i++){const angle=-Math.PI/2+(i-.5)*step,next=angle+step;const g=ctx.createRadialGradient(CX-90,CY-115,10,CX,CY,540);const light=i%2===0;g.addColorStop(0,light?'#ffd2e6':'#dfb4ed');g.addColorStop(.3,light?'#f69cc8':'#c58fd9');g.addColorStop(.71,light?colors[i%colors.length]:'#a565c1');g.addColorStop(1,light?'#a84283':'#6c397f');ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,R,angle,next);ctx.closePath();ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(255,232,251,.88)';ctx.lineWidth=n>22?1.5:3;ctx.stroke();const amid=angle+step/2;ctx.save();ctx.translate(CX+Math.cos(amid)*290,CY+Math.sin(amid)*290);ctx.rotate(amid+Math.PI/2);ctx.fillStyle='rgba(255,244,251,.09)';ctx.beginPath();ctx.ellipse(0,0,90,115,.4,0,Math.PI*2);ctx.fill();ctx.restore();}
const sheen=ctx.createRadialGradient(280,245,60,CX,CY,R);sheen.addColorStop(0,'rgba(255,255,255,.25)');sheen.addColorStop(.45,'rgba(255,255,255,.07)');sheen.addColorStop(1,'rgba(43,3,54,.22)');ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fillStyle=sheen;ctx.fill();ctx.strokeStyle='#ffe9f7bb';ctx.lineWidth=7;ctx.stroke();ctx.beginPath();ctx.arc(CX,CY,R-12,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;ctx.stroke();
// Draw names at large, readable sizes, oriented within the actual wheel segments.
function wheelLabelParts(value,maxWidth){
  const text=String(value).replace(/\s+/g,' ').trim(),chars=Array.from(text);
  if(ctx.measureText(text).width<=maxWidth)return [text];
  let best=null,score=Infinity;
  for(let i=1;i<chars.length;i++){
    const first=chars.slice(0,i).join('').trimEnd(),second=chars.slice(i).join('').trimStart();
    if(!first||!second||ctx.measureText(first).width>maxWidth||ctx.measureText(second).width>maxWidth)continue;
    const wordBreak=chars[i]===' '||chars[i-1]===' ';
    const diff=Math.abs(ctx.measureText(first).width-ctx.measureText(second).width)-(wordBreak?50:0);
    if(diff<score){score=diff;best=[first,second];}
  }
  if(best)return best;
  function fit(text){const arr=Array.from(text);while(arr.length&&ctx.measureText(arr.join('')+'…').width>maxWidth)arr.pop();return arr.join('').trimEnd()+'…';}
  let split=0;
  while(split<chars.length&&ctx.measureText(chars.slice(0,split+1).join('')).width<=maxWidth)split++;
  return [chars.slice(0,split).join('').trimEnd(),fit(chars.slice(split).join('').trimStart())];
}
function wheelSingleLine(value,maxWidth){
  const text=String(value).trim();
  if(ctx.measureText(text).width<=maxWidth)return text;
  const letters=Array.from(text);
  while(letters.length&&ctx.measureText(letters.join('')+'…').width>maxWidth)letters.pop();
  return letters.join('').trimEnd()+'…';
}
function drawWheelName(value,a,n){
  const r=n<=10?340:n<=25?314:302;
  ctx.save();
  ctx.translate(CX+Math.cos(a)*r,CY+Math.sin(a)*r);
  const wrap=n<=10;
  let orientation=wrap?a+Math.PI/2:a;
  if(Math.cos(orientation)<0)orientation+=Math.PI;
  ctx.rotate(orientation);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#fffafe';ctx.strokeStyle='#4b175d';ctx.lineJoin='round';
  ctx.shadowColor='#2b0d3b';ctx.shadowBlur=5;
  const font='900 ';
  if(wrap){
    const base=n<=5?76:n<=8?70:60,min=n<=8?52:46;
    const maxWidth=n===1?300:Math.min(298,2*r*Math.sin(Math.PI/n)*.84);
    let lines=[];
    for(let size=base;size>=min;size-=2){
      ctx.font=font+size+"px 'DM Sans','Trebuchet MS',sans-serif";
      lines=wheelLabelParts(value,maxWidth);
      if(!lines.some(line=>line.includes('…')))break;
    }
    const size=parseInt(ctx.font.match(/(\d+)px/)[1],10);
    const height=size*1.04;
    ctx.lineWidth=7;
    lines.forEach((line,index)=>{const y=(index-(lines.length-1)/2)*height;
      ctx.strokeText(line,0,y);ctx.fillText(line,0,y);});
  }else{
    const size=n<=18?53:n<=30?44:n<=48?35:25;
    ctx.font=font+size+"px 'DM Sans','Trebuchet MS',sans-serif";
    ctx.lineWidth=n>48?3.3:5;
    const line=wheelSingleLine(value,Math.min(252,n<=18?260:226));
    ctx.strokeText(line,0,0);ctx.fillText(line,0,0);
  }
  ctx.restore();
}
// Names are rendered directly into the wheel canvas (never a screenshot or a stretched label).
for(let i=0;i<n;i++){
  const a=-Math.PI/2+i*step;
  if(n<=13){
    const iconR=n<=8?199:210,iconS=n<=8?.8:.57;
    iconFor(items[i],i,CX+Math.cos(a)*iconR,CY+Math.sin(a)*iconR,iconS);
  }
  drawWheelName(items[i],a,n);
}
}
function lights(){const e=$('lights');e.replaceChildren();for(let i=0;i<44;i++){const b=document.createElement('span');b.className='bulb';const angle=i/44*Math.PI*2;b.style.left=(50+47.2*Math.sin(angle))+'%';b.style.top=(50-47.2*Math.cos(angle))+'%';b.style.opacity=String(.53+(i%5)*.1);e.append(b)}}
function update(){save();drawWheel();renderList();}
// Ambient background: animated floating sakura petals, tiny fireflies, moving glints and gently rocking water light.
const amb=$('ambient'),a=amb.getContext('2d');let AW=0,AH=0,DPR=1,particles=[];
function resize(){DPR=Math.min(devicePixelRatio||1,1.8);AW=innerWidth;AH=innerHeight;amb.width=Math.max(1,Math.round(AW*DPR));amb.height=Math.max(1,Math.round(AH*DPR));a.setTransform(DPR,0,0,DPR,0,0);particles=Array.from({length:Math.max(25,Math.min(110,Math.round(AW*AH/12500)))},()=>({x:Math.random()*AW,y:Math.random()*AH,size:1.3+Math.random()*5.9,speed:.12+Math.random()*.42,phase:Math.random()*Math.PI*2,drift:.22+Math.random()*.45,kind:(Math.random()<.19?'flower':Math.random()<.82?'petal':'light'),alpha:.25+Math.random()*.4}));if(!preferLess){celebrateCanvasSize()}}
function petalPath(context,p){context.beginPath();context.moveTo(0,-p.size);context.bezierCurveTo(p.size,-p.size*.7,p.size*.92,p.size*.2,0,p.size);context.bezierCurveTo(-p.size*.93,p.size*.2,-p.size,-p.size*.7,0,-p.size);context.closePath();}
function ambient(t){a.clearRect(0,0,AW,AH);for(let i=0;i<particles.length;i++){const p=particles[i],phase=p.phase+t*.00038;if(!preferLess){p.y+=p.speed;p.x+=Math.sin(phase)*p.drift*.45;if(p.y>AH+30){p.y=-30;p.x=Math.random()*AW}}a.save();a.translate(p.x,p.y);if(p.kind==='petal'){a.rotate(Math.sin(phase)*1.8);a.globalAlpha=p.alpha*(.7+.3*Math.sin(phase*2));a.fillStyle=i%3?'#ff9bc8':'#ffe3ed';petalPath(a,p);a.fill();}else if(p.kind==='flower'){a.rotate(Math.sin(phase)*.8);a.globalAlpha=p.alpha*.9;a.fillStyle='#ffbadc';for(let j=0;j<5;j++){a.save();a.rotate(j*Math.PI*2/5);a.beginPath();a.ellipse(0,-p.size,p.size*.6,p.size,0,0,Math.PI*2);a.fill();a.restore()}a.fillStyle='#ffe7bb';a.beginPath();a.arc(0,0,p.size*.4,0,Math.PI*2);a.fill()}else{a.globalAlpha=p.alpha*(.6+.4*Math.sin(phase*3));a.fillStyle='#ffd6eb';a.shadowColor='#ff9ac9';a.shadowBlur=11;a.beginPath();a.arc(0,0,p.size*.35,0,Math.PI*2);a.fill()}a.restore()}if(!preferLess)ambientFrame=requestAnimationFrame(ambient)}

// Quiet real-world recorded applause; no synthesized meme cheers or loud fallback.
function stopAudio(){cancelAnimationFrame(audioFade);clearTimeout(applauseStop);audio.pause();try{audio.currentTime=0}catch(e){}audio.volume=0}
function softApplause(){stopAudio();if(muted||volume===0)return;const target=Math.min(.24,volume/100*.35);audio.volume=0;audio.play().then(()=>{const start=performance.now(),length=4800;function mix(t){const elapsed=t-start,fadeIn=Math.min(1,elapsed/700),fadeOut=Math.min(1,Math.max(0,length-elapsed)/1150);audio.volume=Math.min(1,target*fadeIn*fadeOut);if(elapsed<length&&!audio.paused)audioFade=requestAnimationFrame(mix);else stopAudio()}audioFade=requestAnimationFrame(mix)}).catch(()=>{/* if remote audio is unavailable, celebrate visually without harsh generated noise */})}
function setRotation(v){rotation=v;$('rotor').style.transform=`rotate(${v}deg)`}
function spin(){if(spinning||!items.length)return;closeWinner();kawaiiSound('spin');spinning=true;renderList();$('spin').disabled=true;const n=items.length,winner=rng(n),step=360/n;const current=((rotation%360)+360)%360,needed=(360-(winner*step)%360)%360,delta=(needed-current+360)%360;const final=rotation+360*(5+rng(3))+delta;const initial=rotation,start=performance.now(),duration=preferLess?600:5800+Math.random()*1000;
let previousWedge=-1,lastTickTime=0;
function animate(now){
  const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4.8);
  const currentRotation=initial+(final-initial)*ease;
  setRotation(currentRotation);
  const wedge=Math.floor((((currentRotation%360)+360)%360)/step);
  if(t>.04&&t<.95&&wedge!==previousWedge&&now-lastTickTime>90){
    lastTickTime=now;kawaiiSound('tick');
  }
  previousWedge=wedge;
  if(t<1){animation=requestAnimationFrame(animate)}else{rotation=final%360;setRotation(rotation);spinning=false;renderList();$('spin').disabled=false;showWinner(items[winner]);}}animation=requestAnimationFrame(animate)}
$('spin').addEventListener('click',spin);
const result=$('result'),conf=$('celebration'),cc=conf.getContext('2d');let falling=[];
resize();addEventListener('resize',resize,{passive:true});ambientFrame=requestAnimationFrame(ambient);
function celebrateCanvasSize(){conf.width=Math.floor(innerWidth*DPR);conf.height=Math.floor(innerHeight*DPR);conf.style.width=innerWidth+'px';conf.style.height=innerHeight+'px';cc.setTransform(DPR,0,0,DPR,0,0)}
function showWinner(name){kawaiiSound('win');lastFocused=document.activeElement;$('winnerName').textContent=name;result.classList.add('show');result.setAttribute('aria-hidden','false');$('done').focus();softApplause();celebrateCanvasSize();const count=preferLess?40:115;falling=Array.from({length:count},(_,i)=>({x:Math.random()*innerWidth,y:-Math.random()*innerHeight*.65,size:3+Math.random()*9,dx:(Math.random()-.5)*1.9,dy:.9+Math.random()*3.1,r:Math.random()*6.28,spin:(Math.random()-.5)*.06,kind:i%4,color:['#ffd8ef','#fb98c9','#d8a5f5','#ffe4cf'][i%4]}));let start=performance.now();function draw(t){const elapsed=(t-start)/1000;cc.clearRect(0,0,innerWidth,innerHeight);for(const p of falling){p.x+=p.dx+Math.sin(t/700+p.r)*.3;p.y+=p.dy;p.r+=p.spin;if(p.y>innerHeight+20){p.y=-30;p.x=Math.random()*innerWidth}cc.save();cc.translate(p.x,p.y);cc.rotate(p.r);cc.globalAlpha=Math.max(0,Math.min(1,(6-elapsed)*.9));cc.fillStyle=p.color;cc.strokeStyle='#fff1f9aa';cc.lineWidth=.6;if(p.kind===0){for(let j=0;j<5;j++){cc.save();cc.rotate(j*2*Math.PI/5);cc.beginPath();cc.ellipse(0,-p.size*.65,p.size*.45,p.size*.68,0,0,2*Math.PI);cc.fill();cc.restore()}}else if(p.kind===1){cc.beginPath();cc.moveTo(0,p.size*.8);cc.bezierCurveTo(-p.size*1.4,-p.size*.35,-p.size*.8,-p.size*1.2,0,-p.size*.5);cc.bezierCurveTo(p.size*.8,-p.size*1.2,p.size*1.4,-p.size*.35,0,p.size*.8);cc.fill()}else{petalPath(cc,p);cc.fill()}cc.restore()}if(elapsed<5.8&&result.classList.contains('show'))celebrateFrame=requestAnimationFrame(draw);else cc.clearRect(0,0,innerWidth,innerHeight)}cancelAnimationFrame(celebrateFrame);celebrateFrame=requestAnimationFrame(draw)}
function closeWinner(){result.classList.remove('show');result.setAttribute('aria-hidden','true');cancelAnimationFrame(celebrateFrame);cc.clearRect(0,0,conf.width,conf.height);stopAudio();if(lastFocused){lastFocused.focus();lastFocused=null}}
$('done').addEventListener('click',closeWinner);$('closeWinner').addEventListener('click',closeWinner);$('again').addEventListener('click',()=>{closeWinner();spin()});result.addEventListener('click',e=>{if(e.target===result)closeWinner()});addEventListener('keydown',e=>{if(e.key==='Escape'&&result.classList.contains('show'))closeWinner();if(e.key==='Tab'&&result.classList.contains('show')){const controls=[$('closeWinner'),$('again'),$('done')];const i=controls.indexOf(document.activeElement);if(e.shiftKey&&i===0){controls[2].focus();e.preventDefault()}else if(!e.shiftKey&&i===2){controls[0].focus();e.preventDefault()}}});
lights();updateSound();drawWheel();renderList();
})();
