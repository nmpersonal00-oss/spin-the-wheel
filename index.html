<script>
(()=>{'use strict';
const defaults=['Pink Bow','Wishing Star','Crystal Heart','Cherry Blossom','Moonbeam','Kitty Paw','Butterfly'];
const colors=['#f76ab6','#b071ca','#e77ebd','#bd75c8','#eb79bc','#a45fb5','#ff94cb','#ab66ca','#de5fbd','#c780d5'];
const el=id=>document.getElementById(id), qs=id=>el(id);
const safeStore={get(){try{let a=JSON.parse(localStorage.getItem('kawaii-spin-v2'));if(a&&Array.isArray(a.items)&&a.items.length<=100)return a}catch(e){}return null},save(){try{localStorage.setItem('kawaii-spin-v2',JSON.stringify({items,custom,mute}))}catch(e){}}};
let previous=safeStore.get();let items=previous?previous.items.filter(x=>typeof x==='string'&&x.trim()).slice(0,60):[...defaults];let custom=previous?!!previous.custom:false;let mute=previous?!!previous.mute:false;
let rotation=0,spinning=false,winIndex=-1,animation=null,sfxContext=null,toastTimer=null,confettiFrame=0;
const rotors=[qs('wheelRotor'),qs('mobileRotor')],spinners=[qs('spinDesktop'),qs('mobileSpin')];
const soundOn='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg>';
const soundOff='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM16 9l5 6m0-6-5 6"/></svg>';
function updateSound(){for(const b of [qs('soundDesktop'),qs('soundMobile')]){b.innerHTML=mute?soundOff:soundOn;b.setAttribute('aria-label',mute?'Enable sound':'Mute sound');b.title=mute?'Enable sound':'Mute sound'}}
function toast(s){const node=qs('status');node.textContent=s;node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),2450)}
function fit(){const stage=qs('stage');const scale=Math.min(window.innerWidth/1672,window.innerHeight/941);stage.style.transform='translate(-50%,-50%) scale('+scale+')'}window.addEventListener('resize',fit);fit();
function renderList(root){root.replaceChildren();items.forEach((name,i)=>{const row=document.createElement('div');row.className='entry';const dot=document.createElement('i');dot.className='bullet';dot.style.setProperty('--c',colors[i%colors.length]);const span=document.createElement('span');span.className='entryText';span.textContent=name;const del=document.createElement('button');del.type='button';del.className='rm';del.textContent='×';del.setAttribute('aria-label','Remove '+name);del.addEventListener('click',()=>{if(spinning)return;items.splice(i,1);custom=true;saveAndRender();});row.append(dot,span,del);root.append(row)});if(!items.length){const p=document.createElement('p');p.textContent='Add a choice to start your wheel.';p.style.cssText='font-size:14px;color:#ffbedf;text-align:center';root.append(p)}}
function drawDynamic(canvas){window.KawaiiVisuals.drawWheel(canvas,items,custom)}
function labels(svg){svg.replaceChildren()}
function updateWheel(){
  for(const [canvas,svg] of [['dynamicDisc','labelLayer'],['mobileDynamicDisc','mobileLabels']]){
    const cv=qs(canvas);cv.style.display='block';drawDynamic(cv);labels(qs(svg));
  }
}
function render(){qs('desktopCount').textContent=items.length;qs('mobileCount').textContent=items.length;renderList(qs('entriesList'));renderList(qs('mobileEntryList'));updateWheel();for(const b of spinners)b.disabled=spinning||items.length===0;}
function saveAndRender(){safeStore.save();render()}
function add(name){if(spinning)return;name=name.trim().replace(/\s+/g,' ');if(!name)return toast('Type something to add first.');if(items.length>=60)return toast('Your wheel can hold up to 60 choices.');if(name.length>48)name=name.slice(0,48);items.push(name);custom=true;saveAndRender();toast('Added '+name);}
for(const [form,input] of [['desktopAdd','desktopInput'],['mobileForm','mobileInput']]){qs(form).addEventListener('submit',e=>{e.preventDefault();add(qs(input).value);qs(input).value='';qs(input).focus()})}
function openEditor(b){qs('editor').classList.toggle('show',b);qs('editDesktop').setAttribute('aria-expanded',String(b))}qs('editDesktop').addEventListener('click',()=>openEditor(!qs('editor').classList.contains('show')));qs('closeEditor').addEventListener('click',()=>openEditor(false));
function shuffle(){if(spinning)return;for(let i=items.length-1;i>0;i--){const j=randomInt(i+1);[items[i],items[j]]=[items[j],items[i]]}custom=true;saveAndRender();toast('Choices shuffled.')}function clearAll(){if(spinning)return;items=[];custom=true;saveAndRender();toast('All choices cleared.')}function reset(){if(spinning)return;items=[...defaults];custom=false;saveAndRender();toast('Cute defaults restored.')}
for(const id of ['shuffleDesk','shuffleMobile'])qs(id).addEventListener('click',shuffle);for(const id of ['clearDesk','clearMobile'])qs(id).addEventListener('click',clearAll);for(const id of ['resetDesk','resetMobile'])qs(id).addEventListener('click',reset);
for(const id of ['soundDesktop','soundMobile'])qs(id).addEventListener('click',()=>{mute=!mute;if(mute)stopApplause();updateSound();safeStore.save();toast(mute?'Sound off':'Sound on')});
function randomInt(n){if(window.crypto?.getRandomValues){let arr=new Uint32Array(1),upper=0x100000000,limit=upper-upper%n;do{crypto.getRandomValues(arr)}while(arr[0]>=limit);return arr[0]%n}return Math.floor(Math.random()*n)}
function ensureAudio(){if(mute)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!sfxContext)sfxContext=new AC();if(sfxContext.state==='suspended')sfxContext.resume()}catch(e){}}
function tick(){if(mute||!sfxContext)return;try{const osc=sfxContext.createOscillator(),gain=sfxContext.createGain(),now=sfxContext.currentTime;osc.type='sine';osc.frequency.setValueAtTime(640,now);osc.frequency.exponentialRampToValueAtTime(230,now+.055);gain.gain.setValueAtTime(.045,now);gain.gain.exponentialRampToValueAtTime(.001,now+.07);osc.connect(gain).connect(sfxContext.destination);osc.start(now);osc.stop(now+.08)}catch(e){}}
let applauseOutput=null;
function stopApplause(){
  if(!applauseOutput||!sfxContext)return;
  try{const t=sfxContext.currentTime;applauseOutput.gain.cancelScheduledValues(t);
    applauseOutput.gain.setTargetAtTime(0,t,.012);}catch(e){}
  applauseOutput=null;
}
function celebrateAudio(){
  if(mute||!sfxContext)return;
  stopApplause();
  try{
    const C=sfxContext,t=C.currentTime,master=C.createGain();
    master.gain.setValueAtTime(.26,t);
    master.connect(C.destination);applauseOutput=master;
    // Small, irregular, filtered handclaps rather than a cheering voice or a loud sample.
    const buffers=Array.from({length:4},()=> {
      const length=Math.floor(C.sampleRate*.13),buffer=C.createBuffer(1,length,C.sampleRate);
      const data=buffer.getChannelData(0);
      for(let k=0;k<length;k++)data[k]=(Math.random()*2-1);
      return buffer;
    });
    for(let i=0;i<15;i++){
      const at=t+.06+i*.106+Math.random()*.045,source=C.createBufferSource();
      const hp=C.createBiquadFilter(),lp=C.createBiquadFilter(),gain=C.createGain();
      source.buffer=buffers[i%buffers.length];
      hp.type='highpass';hp.frequency.value=460+Math.random()*210;
      lp.type='lowpass';lp.frequency.value=1700+Math.random()*850;
      gain.gain.setValueAtTime(.0001,at);
      const level=.070+Math.random()*.027;
      gain.gain.exponentialRampToValueAtTime(level,at+.003);
      gain.gain.exponentialRampToValueAtTime(level*.28,at+.019);
      gain.gain.linearRampToValueAtTime(level*.36,at+.027);
      gain.gain.exponentialRampToValueAtTime(.0001,at+.105);
      source.connect(hp).connect(lp).connect(gain).connect(master);
      source.start(at);source.stop(at+.12);
    }
    master.gain.setTargetAtTime(0,t+2.0,.12);
  }catch(e){}
}
function setRotation(deg){rotation=deg;for(const r of rotors)r.style.transform=`rotate(${deg}deg)`}
function spin(){if(spinning)return;if(!items.length)return toast('Add at least one choice first.');if(qs('result').classList.contains('show'))closeResult();openEditor(false);ensureAudio();spinning=true;render();const n=items.length,chosen=randomInt(n),step=360/n;winIndex=chosen;const origin=rotation,endNormalized=(360-(chosen*step%360))%360,currentNormalized=((origin%360)+360)%360;const delta=(endNormalized-currentNormalized+360)%360;const end=origin+360*(6+randomInt(3))+delta;const duration=6400+randomInt(700),start=performance.now();let lastWedge=-1;
function frame(now){const t=Math.min(1,(now-start)/duration),e=1-Math.pow(1-t,4.3),a=origin+(end-origin)*e;setRotation(a);const curr=Math.floor((((a+90)%360)+360)%360/step);if(curr!==lastWedge&&t>.04&&t<.89){lastWedge=curr;tick()}if(t<1)animation=requestAnimationFrame(frame);else{animation=null;rotation=((end%360)+360)%360;setRotation(rotation);spinning=false;render();revealWinner(items[chosen]);}}animation=requestAnimationFrame(frame)}
for(const b of spinners)b.addEventListener('click',spin);
function revealWinner(name){qs('winnerName').textContent=name;qs('result').classList.add('show');qs('spinAgain').focus();celebrateAudio();confettiStart()}
function closeResult(){qs('result').classList.remove('show');cancelAnimationFrame(confettiFrame);const c=qs('confetti');c.getContext('2d').clearRect(0,0,c.width,c.height);stopApplause()}
qs('closeWinner').addEventListener('click',closeResult);qs('doneWinner').addEventListener('click',closeResult);qs('spinAgain').addEventListener('click',()=>{closeResult();spin()});qs('result').addEventListener('click',e=>{if(e.target===qs('result'))closeResult()});window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeResult();openEditor(false)}});
function confettiStart(){const canvas=qs('confetti'),ctx=canvas.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);const w=window.innerWidth,h=window.innerHeight;canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);const petals=Array.from({length:125},(_,i)=>({x:Math.random()*w,y:Math.random()*h-h/2,vx:(Math.random()-.5)*2,vy:1+Math.random()*3,rad:3+Math.random()*7,ang:Math.random()*6.28,spin:(Math.random()-.5)*.09,type:i%3,color:['#ff8bca','#f9c1e9','#da9cff','#ffe0f7','#ffbda1'][i%5]}));let begun=performance.now();function heart(p){ctx.beginPath();ctx.moveTo(0,4);ctx.bezierCurveTo(-18,-6,-12,-19,0,-11);ctx.bezierCurveTo(12,-19,18,-6,0,4);ctx.closePath()}function flower(p){for(let j=0;j<5;j++){ctx.rotate(Math.PI*2/5);ctx.beginPath();ctx.ellipse(0,-p.rad*.8,p.rad*.44,p.rad*.8,0,0,Math.PI*2);ctx.fill()}ctx.beginPath();ctx.arc(0,0,1.5,0,7);ctx.fillStyle='#fff2cf';ctx.fill()}
function frame(t){ctx.clearRect(0,0,w,h);const f=(t-begun)/1000;for(const p of petals){p.x+=p.vx;p.y+=p.vy;p.ang+=p.spin;if(p.y>h+25){p.y=-20;p.x=Math.random()*w}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);ctx.globalAlpha=Math.min(1,(7.6-f)*.5);ctx.fillStyle=p.color;if(p.type===0){flower(p)}else if(p.type===1){ctx.scale(p.rad/9,p.rad/9);heart(p);ctx.fill()}else{ctx.beginPath();ctx.ellipse(0,0,p.rad*.7,p.rad*1.5,Math.sin(p.ang),0,7);ctx.fill()}ctx.restore()}if(f<6.9&&qs('result').classList.contains('show'))confettiFrame=requestAnimationFrame(frame);else ctx.clearRect(0,0,w,h)}cancelAnimationFrame(confettiFrame);confettiFrame=requestAnimationFrame(frame)}
updateSound();render();setRotation(0);
})();
